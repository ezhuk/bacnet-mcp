[project]
name = "bacnet-mcp"
version = "0.4.0"
description = "A Model Context Protocol (MCP) server for BACnet."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bacpypes3>=0.0.110",
    "fastmcp>=4.0.0",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.0",
]

[project.scripts]
bacnet-mcp = "bacnet_mcp.cli:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.3.0",
    "ruff>=0.12.0",
    "ty>=0.0.83",
]

[tool.ty.src]
exclude = [
    "examples",
]
